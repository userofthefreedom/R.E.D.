services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: permit
      POSTGRES_USER: permit
      POSTGRES_PASSWORD: permit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:

